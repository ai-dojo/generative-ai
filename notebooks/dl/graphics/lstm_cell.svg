<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#403931"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E3584D"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#FFFFFF"/>
  <g transform="translate(0,-40)">

  <!-- cell body -->
  <rect x="120" y="70" width="580" height="350" rx="16" fill="#F0F0F0" stroke="#2F3E46" stroke-width="2"/>
  <text x="136" y="94" font-size="14" font-weight="bold" fill="#7A7D80">LSTM cell</text>

  <!-- ===== hidden-state / input paths (drawn first, under the nodes) ===== -->
  <g fill="none" stroke="#403931" stroke-width="2">
    <!-- h_{t-1} in -->
    <line x1="40" y1="370" x2="143" y2="370" marker-end="url(#a)"/>
    <!-- x_t in -->
    <line x1="170" y1="500" x2="170" y2="386" marker-end="url(#a)"/>
    <!-- bus from concat to the four layers -->
    <line x1="195" y1="370" x2="570" y2="370"/>
    <line x1="250" y1="370" x2="250" y2="338" marker-end="url(#a)"/>
    <line x1="360" y1="370" x2="360" y2="338" marker-end="url(#a)"/>
    <line x1="460" y1="370" x2="460" y2="338" marker-end="url(#a)"/>
    <line x1="570" y1="370" x2="570" y2="338" marker-end="url(#a)"/>
    <!-- forget gate -> x on cell state -->
    <line x1="250" y1="290" x2="250" y2="136" marker-end="url(#a)"/>
    <!-- input gate and candidate -> x -->
    <polyline points="360,290 360,210 394,210" marker-end="url(#a)"/>
    <polyline points="460,290 460,210 426,210" marker-end="url(#a)"/>
    <!-- x -> + on cell state -->
    <line x1="410" y1="196" x2="410" y2="136" marker-end="url(#a)"/>
    <!-- output gate -> x -->
    <polyline points="570,290 570,260 634,260" marker-end="url(#a)"/>
    <!-- cell state branch -> tanh -> x -->
    <line x1="650" y1="120" x2="650" y2="173" marker-end="url(#a)"/>
    <line x1="650" y1="205" x2="650" y2="244" marker-end="url(#a)"/>
    <!-- x -> h_t out -->
    <polyline points="650,276 650,370 772,370" marker-end="url(#a)"/>
  </g>

  <!-- ===== cell state lane ===== -->
  <g stroke="#E3584D" stroke-width="5" fill="none">
    <line x1="40" y1="120" x2="234" y2="120" marker-end="url(#ar)"/>
    <line x1="266" y1="120" x2="394" y2="120" marker-end="url(#ar)"/>
    <line x1="426" y1="120" x2="772" y2="120" marker-end="url(#ar)"/>
  </g>
  <circle cx="650" cy="120" r="5" fill="#403931"/>
  <text x="537" y="108" font-size="13" font-weight="bold" fill="#E3584D" text-anchor="middle">cell state (memory)</text>

  <!-- ===== pointwise operations ===== -->
  <g stroke="#403931" stroke-width="2" fill="#D0C1A5">
    <circle cx="250" cy="120" r="15"/>
    <circle cx="410" cy="120" r="15"/>
    <circle cx="410" cy="210" r="15"/>
    <circle cx="650" cy="260" r="15"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#403931" text-anchor="middle">
    <text x="250" y="127">×</text>
    <text x="410" y="127">+</text>
    <text x="410" y="217">×</text>
    <text x="650" y="267">×</text>
  </g>
  <!-- tanh on cell state -->
  <ellipse cx="650" cy="190" rx="28" ry="15" fill="#F2B66D" stroke="#403931" stroke-width="2"/>
  <text x="650" y="195" font-size="14" font-weight="bold" fill="#403931" text-anchor="middle">tanh</text>

  <!-- step captions -->
  <g font-size="12" fill="#7A7D80" text-anchor="middle">
    <text x="250" y="96">forget</text>
    <text x="410" y="96">write</text>
    <text x="650" y="96">read</text>
  </g>

  <!-- ===== layers ===== -->
  <g stroke="#2F3E46" stroke-width="2">
    <rect x="210" y="290" width="80" height="46" rx="6" fill="#6CA0A3"/>
    <rect x="320" y="290" width="80" height="46" rx="6" fill="#6CA0A3"/>
    <rect x="420" y="290" width="80" height="46" rx="6" fill="#F2B66D"/>
    <rect x="530" y="290" width="80" height="46" rx="6" fill="#6CA0A3"/>
  </g>
  <g text-anchor="middle">
    <text x="250" y="313" font-size="20" font-weight="bold" fill="#FFFFFF">σ</text>
    <text x="250" y="329" font-size="11" fill="#FFFFFF">forget gate</text>
    <text x="360" y="313" font-size="20" font-weight="bold" fill="#FFFFFF">σ</text>
    <text x="360" y="329" font-size="11" fill="#FFFFFF">input gate</text>
    <text x="460" y="312" font-size="16" font-weight="bold" fill="#403931">tanh</text>
    <text x="460" y="329" font-size="11" fill="#403931">candidate</text>
    <text x="570" y="313" font-size="20" font-weight="bold" fill="#FFFFFF">σ</text>
    <text x="570" y="329" font-size="11" fill="#FFFFFF">output gate</text>
  </g>

  <!-- concat -->
  <rect x="145" y="356" width="50" height="28" rx="5" fill="#D0C1A5" stroke="#403931" stroke-width="2"/>
  <text x="170" y="374" font-size="11" fill="#403931" text-anchor="middle">concat</text>

  <!-- signal labels -->
  <g font-size="15" font-style="italic" fill="#2F3E46">
    <text x="240" y="220" text-anchor="end">f<tspan dy="4" font-size="11">t</tspan></text>
    <text x="350" y="252" text-anchor="end">i<tspan dy="4" font-size="11">t</tspan></text>
    <text x="470" y="252">c̃<tspan dy="4" font-size="11">t</tspan></text>
    <text x="602" y="252" text-anchor="middle">o<tspan dy="4" font-size="11">t</tspan></text>
  </g>

  <!-- ===== external labels ===== -->
  <g font-size="18" font-style="italic" fill="#2F3E46">
    <text x="40" y="103">c<tspan dy="5" font-size="13">t−1</tspan></text>
    <text x="40" y="358">h<tspan dy="5" font-size="13">t−1</tspan></text>
    <text x="772" y="103" text-anchor="end">c<tspan dy="5" font-size="13">t</tspan></text>
    <text x="772" y="358" text-anchor="end">h<tspan dy="5" font-size="13">t</tspan></text>
    <text x="170" y="522" text-anchor="middle">x<tspan dy="5" font-size="13">t</tspan></text>
  </g>
  <g font-size="12" fill="#7A7D80">
    <text x="40" y="142">previous</text>
    <text x="40" y="157">cell state</text>
    <text x="40" y="392">previous</text>
    <text x="40" y="407">hidden state</text>
    <text x="772" y="142" text-anchor="end">next step</text>
    <text x="772" y="392" text-anchor="end">output &amp;</text>
    <text x="772" y="407" text-anchor="end">next step</text>
    <text x="170" y="544" text-anchor="middle">input</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="13" fill="#403931">
    <rect x="270" y="472" width="26" height="18" rx="4" fill="#6CA0A3" stroke="#2F3E46" stroke-width="1.5"/>
    <text x="283" y="486" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">σ</text>
    <text x="304" y="486">gate: sigmoid layer, outputs 0 (block) … 1 (let through)</text>

    <rect x="270" y="502" width="26" height="18" rx="4" fill="#F2B66D" stroke="#2F3E46" stroke-width="1.5"/>
    <text x="304" y="516">tanh layer: proposes new values in −1 … 1</text>

    <circle cx="283" cy="541" r="10" fill="#D0C1A5" stroke="#403931" stroke-width="1.5"/>
    <text x="283" y="546" font-size="14" font-weight="bold" text-anchor="middle">×</text>
    <text x="304" y="546">pointwise multiply</text>
    <circle cx="463" cy="541" r="10" fill="#D0C1A5" stroke="#403931" stroke-width="1.5"/>
    <text x="463" y="546" font-size="14" font-weight="bold" text-anchor="middle">+</text>
    <text x="484" y="546">pointwise add</text>

    <line x1="270" y1="570" x2="296" y2="570" stroke="#E3584D" stroke-width="5"/>
    <text x="304" y="575">cell state path: changed only by × and +, so information can travel far</text>
  </g>
  </g>
</svg>
