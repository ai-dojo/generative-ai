<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F3E46"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A7D80"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#FFFFFF"/>

  <!-- ===== Finite state control ===== -->
  <rect x="40" y="20" width="720" height="240" rx="14" fill="#F0F0F0" stroke="#2F3E46" stroke-width="2"/>
  <text x="60" y="48" font-size="18" font-weight="bold" fill="#2F3E46">Finite state control</text>

  <!-- state diagram -->
  <g font-size="13" fill="#403931" text-anchor="middle">
    <!-- self-loop q0 -->
    <path d="M106,146 C 82,92 158,92 134,146" fill="none" stroke="#2F3E46" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="120" y="80">0→0,R</text>
    <text x="120" y="95">1→1,R</text>
    <!-- self-loop q1 -->
    <path d="M236,146 C 212,92 288,92 264,146" fill="none" stroke="#2F3E46" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="250" y="95">1→0,L</text>
    <!-- q0 -> q1 -->
    <line x1="148" y1="170" x2="220" y2="170" stroke="#2F3E46" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="185" y="161">_→_,L</text>
    <!-- q1 -> H -->
    <line x1="278" y1="170" x2="340" y2="170" stroke="#2F3E46" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="309" y="146">0→1</text>
    <text x="309" y="161">_→1</text>
  </g>
  <circle cx="120" cy="170" r="28" fill="#FFFFFF" stroke="#2F3E46" stroke-width="2"/>
  <circle cx="250" cy="170" r="28" fill="#F2B66D" stroke="#2F3E46" stroke-width="2"/>
  <circle cx="370" cy="170" r="28" fill="#FFFFFF" stroke="#2F3E46" stroke-width="2"/>
  <circle cx="370" cy="170" r="22" fill="none" stroke="#2F3E46" stroke-width="1.5"/>
  <g font-size="17" font-weight="bold" fill="#2F3E46" text-anchor="middle">
    <text x="120" y="176">q0</text>
    <text x="250" y="176">q1</text>
    <text x="370" y="176">H</text>
  </g>
  <g font-size="12" fill="#7A7D80" text-anchor="middle">
    <text x="120" y="216">start</text>
    <text x="250" y="216">current state</text>
    <text x="370" y="216">halt</text>
  </g>
  <text x="60" y="246" font-size="12" fill="#7A7D80">edge label: read → write, move (L/R)</text>

  <!-- divider -->
  <line x1="420" y1="40" x2="420" y2="240" stroke="#D0C1A5" stroke-width="1.5"/>

  <!-- transition table -->
  <text x="440" y="60" font-size="15" font-weight="bold" fill="#2F3E46">Transition rules (the program)</text>
  <g font-size="13" font-weight="bold" fill="#7A7D80" text-anchor="middle">
    <text x="465" y="86">state</text>
    <text x="520" y="86">read</text>
    <text x="580" y="86">write</text>
    <text x="640" y="86">move</text>
    <text x="700" y="86">next</text>
  </g>
  <line x1="440" y1="93" x2="735" y2="93" stroke="#7A7D80" stroke-width="1"/>
  <rect x="440" y="164" width="295" height="22" rx="3" fill="#F2B66D" opacity="0.55"/>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2F3E46" text-anchor="middle">
    <text x="465" y="113">q0</text><text x="520" y="113">0</text><text x="580" y="113">0</text><text x="640" y="113">R</text><text x="700" y="113">q0</text>
    <text x="465" y="135">q0</text><text x="520" y="135">1</text><text x="580" y="135">1</text><text x="640" y="135">R</text><text x="700" y="135">q0</text>
    <text x="465" y="157">q0</text><text x="520" y="157">_</text><text x="580" y="157">_</text><text x="640" y="157">L</text><text x="700" y="157">q1</text>
    <text x="465" y="180">q1</text><text x="520" y="180">1</text><text x="580" y="180">0</text><text x="640" y="180">L</text><text x="700" y="180">q1</text>
    <text x="465" y="202">q1</text><text x="520" y="202">0</text><text x="580" y="202">1</text><text x="640" y="202">–</text><text x="700" y="202">H</text>
    <text x="465" y="224">q1</text><text x="520" y="224">_</text><text x="580" y="224">1</text><text x="640" y="224">–</text><text x="700" y="224">H</text>
  </g>
  <text x="440" y="248" font-size="12" fill="#7A7D80">highlighted: the rule applied in the current step</text>

  <!-- ===== Head ===== -->
  <line x1="400" y1="260" x2="400" y2="282" stroke="#2F3E46" stroke-width="3"/>
  <polygon points="378,282 422,282 422,302 400,322 378,302" fill="#6CA0A3" stroke="#2F3E46" stroke-width="2"/>
  <text x="438" y="296" font-size="15" font-weight="bold" fill="#2F3E46">read/write head</text>
  <text x="438" y="314" font-size="13" fill="#7A7D80">reads one symbol, writes one, moves L or R</text>

  <!-- ===== Tape ===== -->
  <g stroke="#2F3E46" stroke-width="1.6" fill="#FFFFFF">
    <rect x="75" y="330" width="50" height="50" stroke="#7A7D80" stroke-dasharray="4 3"/>
    <rect x="125" y="330" width="50" height="50"/>
    <rect x="175" y="330" width="50" height="50"/>
    <rect x="225" y="330" width="50" height="50"/>
    <rect x="275" y="330" width="50" height="50"/>
    <rect x="325" y="330" width="50" height="50"/>
    <rect x="375" y="330" width="50" height="50" fill="#F2B66D" stroke-width="2.5"/>
    <rect x="425" y="330" width="50" height="50"/>
    <rect x="475" y="330" width="50" height="50"/>
    <rect x="525" y="330" width="50" height="50"/>
    <rect x="575" y="330" width="50" height="50"/>
    <rect x="625" y="330" width="50" height="50"/>
    <rect x="675" y="330" width="50" height="50" stroke="#7A7D80" stroke-dasharray="4 3"/>
  </g>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#2F3E46" text-anchor="middle">
    <text x="300" y="363">1</text>
    <text x="350" y="363">0</text>
    <text x="400" y="363" font-weight="bold">1</text>
    <text x="450" y="363">0</text>
  </g>
  <g font-size="22" fill="#7A7D80" text-anchor="middle">
    <text x="52" y="362">…</text>
    <text x="748" y="362">…</text>
  </g>
  <line x1="80" y1="400" x2="720" y2="400" stroke="#7A7D80" stroke-width="1.5" marker-start="url(#arrGray)" marker-end="url(#arrGray)"/>
  <text x="400" y="424" font-size="14" fill="#403931" text-anchor="middle">infinite tape of cells, each holding one symbol (empty cells are blank “_”)</text>
  <text x="400" y="460" font-size="13" fill="#7A7D80" text-anchor="middle" font-style="italic">Example program: add 1 to a binary number (1011 → 1100); shown mid-run, carrying the 1 leftwards</text>
</svg>
